[project]
name = "aegismind-workspace"
version = "0.1.0"
description = "AegisMind enterprise knowledge platform monorepo workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "alembic>=1.20.0",
    "pypdf>=6.19.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "vcrpy>=6",
    "pytest-recording>=0.13",
    "syrupy>=4.7",
]
integration = []

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "vcrpy>=6",
    "pytest-recording>=0.13",
    "syrupy>=4.7",
]
integration = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "connectors/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"packages/**/tests/**" = ["S101", "S105", "S106"]
"connectors/**/tests/**" = ["S101", "S105", "S106"]
"**/verify/**" = ["S101"]
"examples/**" = ["S101"]

[tool.mypy]
files = ["packages", "connectors", "tests"]
exclude = ["^src/"]
strict = true
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "connectors", "tests"]
pythonpath = [
    "packages/aegismind-core/src",
    "src",
    "packages/aegismind-types/src",
    "packages/aegismind-connector-sdk/src",
    "packages/aegismind-infra/src",
    "packages/aegismind-identity/src",
    "packages/aegismind-retrieval/src",
    "packages/aegismind-ingestion/src",
    "packages/aegismind-mcp-bridge/src",
    "packages/aegismind-graph/src",
    "packages/aegismind-approval/src",
    "connectors/local_filesystem/src",
    "connectors/github/src",
    "connectors/gmail/src",
]
markers = [
    "integration: marks tests as integration tests requiring external services",
    "conformance: marks tests as architectural or interface conformance tests",
    "guardrail: marks tests as security or access guardrail tests",
]
